# S13: the ConvNeXt U-Net (nets.ConvNeXtUNet, default size: 5.46M parameters against the tuned
# U-Net's 4.86M). Training settings are the S11 tuned ones, unchanged.
# Run: uv run python -m urbanwind.dl.train --config pipeline/S13_hybrid/configs/convnext_unet.yaml --seed 0 --folds 0
exp_id: s13_convnext_unet
stage: S13
out_dir: pipeline/S13_hybrid/outputs/runs
split: grouped
model:
  name: convnext_unet
  kwargs: {dropout: 0.08}
loss: l1
lr: 3.6e-4
min_lr: 1.0e-5
weight_decay: 6.5e-5
batch: 16
max_epochs: 100
patience: 30
inner_val_fraction: 0.15
patch: 256
border: 16
mirror: true
amp: true
clip: 1.0
mirror_tta: true
native_upsample: bilinear   # how a 1 m prediction reaches a 0.5 m case's grid (bilinear or copy)
