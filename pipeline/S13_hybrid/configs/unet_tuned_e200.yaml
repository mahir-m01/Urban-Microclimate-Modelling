# S13: the S11 tuned U-Net trained for 200 epochs instead of 100. The only change from
# pipeline/S11_unet_baseline/configs/unet_tuned.yaml is max_epochs (the cosine schedule stretches with it).
# Run: uv run python -m urbanwind.dl.train --config pipeline/S13_hybrid/configs/unet_tuned_e200.yaml --seed 0 --folds 0
exp_id: s13_unet_tuned_e200
stage: S13
out_dir: pipeline/S13_hybrid/outputs/runs
split: grouped
model:
  name: unet
  kwargs: {widths: [24, 48, 96, 192], bottleneck: 384, dropout: 0.08}
loss: l1
lr: 3.6e-4
min_lr: 1.0e-5
weight_decay: 6.5e-5
batch: 16
max_epochs: 200
patience: 30
inner_val_fraction: 0.15
patch: 256
border: 16
mirror: true
amp: true
clip: 1.0
mirror_tta: true
native_upsample: bilinear   # how a 1 m prediction reaches a 0.5 m case's grid (bilinear or copy)
