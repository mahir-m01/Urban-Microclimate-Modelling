# S11 baseline: the periodic U-Net on the five grouped folds.
# Run: uv run python -m urbanwind.dl.train --config pipeline/S11_unet_baseline/configs/unet.yaml --seed 0
exp_id: s11_unet
stage: S11
out_dir: pipeline/S11_unet_baseline/outputs/runs
split: grouped
model:
  name: unet
  kwargs: {widths: [32, 64, 128, 256], bottleneck: 512, dropout: 0.1}
loss: l1
lr: 1.0e-3
min_lr: 1.0e-5
weight_decay: 1.0e-4
batch: 16
max_epochs: 100
patience: 30
inner_val_fraction: 0.15
patch: 256
border: 16
mirror: true
amp: true
clip: 1.0
mirror_tta: true
native_upsample: bilinear   # how a 1 m prediction reaches a 0.5 m case's grid (bilinear or copy)
