# S11 leakage comparison: unet_tuned.yaml on a random five-fold split of the same 482 cases. The gap to the
# grouped result shows how much a split that ignores cities and layout families flatters the model.
# Run: uv run python -m urbanwind.dl.train --config pipeline/S11_unet_baseline/configs/unet_tuned_random.yaml --seed 0
exp_id: s11_unet_tuned_random
stage: S11
out_dir: pipeline/S11_unet_baseline/outputs/runs
split: random   # leakage comparison only: cases dealt into folds at random, ignoring city or layout family
model:
  name: unet
  kwargs: {widths: [24, 48, 96, 192], bottleneck: 384, dropout: 0.08}
loss: l1
lr: 3.6e-4
min_lr: 1.0e-5
weight_decay: 6.5e-5
batch: 16
max_epochs: 100
patience: 30
inner_val_fraction: 0.15
patch: 256
border: 16
mirror: true
amp: true
clip: 1.0
mirror_tta: true
native_upsample: bilinear   # how a 1 m prediction reaches a 0.5 m case's grid (bilinear or copy)
